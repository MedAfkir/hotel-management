services:
  postgres:
    image: postgres:17-alpine
    container_name: hotel-postgres
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - hotel-postgres-data:/var/lib/postgresql/data

volumes:
  hotel-postgres-data:
