server:
  port: 8083

spring:
  application:
    name: reservation-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/reservation
    username: hotel
    password: hotel
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

reservation:
  overbooking-factor: 1.10
  currency: EUR
  default-nightly-rate: 100.00

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
