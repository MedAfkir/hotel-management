server:
  port: 8088

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/notification
    username: hotel
    password: hotel
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hotel}
    password: ${RABBITMQ_PASSWORD:hotel}
  cloud:
    function:
      definition: reservationEvents
    stream:
      bindings:
        reservationEvents-in-0:
          destination: reservation-events
          group: notification-service
          consumer:
            max-attempts: 3
      rabbit:
        bindings:
          reservationEvents-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
